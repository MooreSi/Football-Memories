server {
    listen 80;
    root /usr/share/nginx/html;
    # Photos (10 MB) and backup uploads (200 MB) are limited by the backend itself.
    client_max_body_size 210m;
    # The Hudl match list with every tag is tens of MB of JSON; compress it for phones.
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/vnd.apple.mpegurl text/css application/javascript;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # D-028 (owner request 2026-11-11): phones and tablets on the local network reach
    # the desktop helper through this server, because 127.0.0.1:8766 on a phone is the
    # phone itself. The helper still only listens on the Mac's 127.0.0.1 and still
    # checks Host/Origin; this proxy presents the local app's values.
    location /helper/ {
        proxy_pass http://host.docker.internal:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 1900s;
        client_max_body_size 40m;
    }
    # The helper's stream playlists refer to their segments as /stream/<id>/<n>.
    location /stream/ {
        proxy_pass http://host.docker.internal:8766;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
