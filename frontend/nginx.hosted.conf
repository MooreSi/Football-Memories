# Hosted gateway task 080 (owner decision 011): the web server of a hosted user's copy.
# Same as nginx.conf without the /helper/ and /stream/ routes: a hosted copy must never
# reach the owner's desktop helper, which holds the owner's Hudl and Veo sessions.
# It has no published port; the gateway is the only thing that talks to it.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    # Photos (10 MB) and backup uploads (200 MB) are limited by the backend itself.
    client_max_body_size 210m;
    # The Hudl match list with every tag is tens of MB of JSON; compress it for phones.
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/vnd.apple.mpegurl text/css application/javascript;

    # Owner request 2026-11-14: a match video added on the Import page, streamed
    # straight to the backend (which caps it at 50 GB) rather than buffered here.
    location = /api/imports/upload {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 50g;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
