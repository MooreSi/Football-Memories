# Hosted gateway (owner decision 011): the web server of a hosted user's copy. It has no
# published port; the gateway is the only thing that talks to it. Unlike nginx.conf, /helper/
# and /stream/ go to THIS user's own capture container (phase 2), never to this computer or
# the owner's desktop helper. The gateway refuses them until the user confirms permission.
server {
    listen 80;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    root /usr/share/nginx/html;
    # Photos (10 MB) and backup uploads (200 MB) are limited by the backend itself.
    client_max_body_size 210m;
    # The Hudl match list with every tag is tens of MB of JSON; compress it for phones.
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/vnd.apple.mpegurl text/css application/javascript;

    # Owner request 2026-11-14: a match video added on the Import page, streamed
    # straight to the backend (which caps it at 50 GB) rather than buffered here.
    location = /api/imports/upload {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 50g;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Phase 2: the user's own Hudl/Veo helper (alias "capture" on their private network). It
    # checks Host and Origin; these are the values it accepts from this app. Looked up per
    # request (Docker's DNS), so a stopped capture container never stops this web server.
    location /helper/ {
        set $capture capture;
        rewrite ^/helper/(.*)$ /$1 break;
        proxy_pass http://$capture:8766;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 1900s;
        client_max_body_size 40m;
    }
    location /stream/ {
        set $capture capture;
        proxy_pass http://$capture:8766;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
